name: dbt Production

# THE PRODUCTION GATE. Nothing here runs until the owner has switched it on, and then only after a named person
# approves each run. Four independent locks, all of which must be opened:
#
#   1. the repository variable PRODUCTION_ENABLED is `true`      (set by the owner, after written sign-off)
#   2. the run is started by hand and `confirm` is typed          (no schedule, no push or pull_request trigger)
#   3. the GitHub environment `production` has required reviewers (the job waits for their approval)
#   4. the `production` environment has its own Snowflake secrets, from a production connection that is not dev's
#
# The Tekspaz platform can open locks 1, 2 and 4 when the project's approver presses "Deploy to production"
# (it writes the production connection into this environment, sets PRODUCTION_ENABLED and starts the run with
# apply ticked). It never touches lock 3: it refuses to start when the environment has no required reviewer, and
# GitHub holds every run for that person. Dry run by default: `apply` unticked only compiles against production.
# AGENTS.md: never touch production or a customer account without the owner's written sign-off.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PRODUCTION to confirm
        type: string
        required: true
      apply:
        description: Apply changes (unticked is a dry run, dbt compile only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    if: vars.PRODUCTION_ENABLED == 'true' && inputs.confirm == 'PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    env:
      DBT_TARGET: prod
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE || vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      # dbt on the customer's own dbt Cloud (docs/dbt-cloud.md): their production job, on its own branch (never
      # overridden here: production runs what its dbt Cloud environment is set to, the default branch).
      DBT_CLOUD_ACCOUNT_ID: ${{ secrets.DBT_CLOUD_ACCOUNT_ID }}
      DBT_CLOUD_JOB_ID: ${{ secrets.DBT_CLOUD_JOB_ID }}
      DBT_CLOUD_TOKEN: ${{ secrets.DBT_CLOUD_TOKEN }}
      DBT_CLOUD_HOST: ${{ secrets.DBT_CLOUD_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Refuse a target that looks like dev
        run: |
          case "$SNOWFLAKE_DATABASE" in
            ""|*_DEV|*_DEV_*) echo "SNOWFLAKE_DATABASE must be the production database, not '$SNOWFLAKE_DATABASE'"; exit 1;;
          esac

      - name: dbt compile (dry run)
        if: ${{ !inputs.apply && env.DBT_CLOUD_JOB_ID == '' }}
        working-directory: dbt
        run: dbt deps && dbt compile

      - name: dbt build in production
        if: ${{ inputs.apply && env.DBT_CLOUD_JOB_ID == '' }}
        working-directory: dbt
        run: dbt deps && dbt build

      - name: dbt compile (dry run) on the customer's dbt Cloud
        if: ${{ !inputs.apply && env.DBT_CLOUD_JOB_ID != '' }}
        run: python python/loaders/dbt_cloud_run.py --step "dbt compile"

      - name: dbt build in production on the customer's dbt Cloud
        if: ${{ inputs.apply && env.DBT_CLOUD_JOB_ID != '' }}
        run: python python/loaders/dbt_cloud_run.py --step "dbt build" --run-results dbt/target/run_results.json
