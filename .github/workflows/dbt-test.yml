name: dbt Test

# Builds the whole lakehouse on every PR: generate -> load -> dbt build -> forecast -> dbt build,
# on the DuckDB stand-in (no account needed), including an incremental re-run with late data.
# The same models run on Snowflake DAILY_EXPENSE_TRACKER_FINTECH_APPLICATION_SANDBOX by hand (workflow_dispatch) once the key pair is set.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      snowflake:
        description: Also build on Snowflake DAILY_EXPENSE_TRACKER_FINTECH_APPLICATION_SANDBOX (needs the key-pair secrets)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write   # PR comment step

jobs:
  build-duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run the pipeline (small dataset, with incremental check)
        run: python scripts/run_pipeline.py --small --incremental_check

      - name: Summarise run results
        id: summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib, collections
          lines = ["## dbt build on DuckDB", "", "| step | pass | warn | error | skip |", "|---|---|---|---|---|"]
          for f in sorted(pathlib.Path("data/artifacts").glob("run_results_*.json")):
              c = collections.Counter(r["status"] for r in json.loads(f.read_text())["results"])
              ok = c["pass"] + c["success"]
              lines.append(f"| {f.stem.removeprefix('run_results_')} | {ok} | {c['warn']} | {c['error'] + c['fail']} | {c['skipped']} |")
          m = pathlib.Path("data/forecast_metrics.json")
          if m.exists():
              mape = json.loads(m.read_text())["holdout_mape"]
              lines += ["", f"Forecast holdout MAPE: **{mape:.1%}** (target < 30%)"]
          print("\n".join(lines))
          EOF
          cp "$GITHUB_STEP_SUMMARY" summary.md

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dbt-run-results
          path: |
            data/artifacts/
            data/forecast_metrics.json
            data/generated/ground_truth.json
            dbt/target/run_results.json

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('summary.md') ? fs.readFileSync('summary.md', 'utf8') : 'dbt build summary unavailable';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body + `\n\n[Run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            });

  build-snowflake-dev:
    # The Snowflake build is shared with the nightly schedule: .github/workflows/snowflake-build.yml
    if: github.event_name == 'workflow_dispatch' && inputs.snowflake
    uses: ./.github/workflows/snowflake-build.yml
    secrets: inherit
