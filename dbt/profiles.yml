# No secrets in this file: everything sensitive comes from environment variables.
# Run from the dbt/ directory, or pass --profiles-dir dbt.

daily_expense_tracker_fintech_application:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    # Local stand-in for Snowflake: a DuckDB file loaded by python -m loaders.duckdb_loader
    local:
      type: duckdb
      path: "{{ env_var('LAKEHOUSE_DUCKDB_PATH', '../data/lakehouse.duckdb') }}"
      schema: gold
      threads: 4

    # Snowflake DAILY_EXPENSE_TRACKER_FINTECH_APPLICATION_SANDBOX, key-pair auth (K-9). Never point this at production.
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DAILY_EXPENSE_TRACKER_FINTECH_APPLICATION_PIPELINE_ROLE') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY', '') }}"            # PEM text, or
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"  # a key file
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'DAILY_EXPENSE_TRACKER_FINTECH_APPLICATION_DEV') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DAILY_EXPENSE_TRACKER_FINTECH_APPLICATION_PIPELINE_XS') }}"
      schema: gold
      threads: 4
      client_session_keep_alive: false
      # Session default, so dbt's own metadata queries are tagged too; each model's +query_tag adds the rest
      query_tag: '{"project":"daily-expense-tracker-fintech-application","environment":"dev","tool":"dbt"}'

    # Production: gated by .github/workflows/dbt-production.yml, which needs the owner's written sign-off.
    # Deliberately no defaults: every value comes from the `production` environment or the run fails.
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: gold
      threads: 4
      client_session_keep_alive: false
      query_tag: '{"project":"daily-expense-tracker-fintech-application","environment":"prod","tool":"dbt"}'
